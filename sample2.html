
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head runat="server">
    <meta charset="UTF-8" />
    <script>
        (function () {
            var ua = navigator.userAgent.toLowerCase();
            var isAndroid = /android/.test(ua);
            var isIOS = /iphone|ipad|ipod/.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

            if (isAndroid) {
                location.href = "https://play.google.com/store/apps/details?id=kr.co.businesson.smartbill2";
            } else if (isIOS) {
                location.href = "https://apps.apple.com/kr/app/%EC%8A%A4%EB%A7%88%ED%8A%B8%EB%B9%8C-%EC%A0%84%EC%9E%90%EC%84%B8%EA%B8%88%EA%B3%84%EC%82%B0%EC%84%9C/id6760402235";
            } else {
                alert("안드로이드, iOS에서만 가능합니다.");
            }

            setTimeout(() => {
                window.close();
            }, 1000);
        })();
    </script>
</head>
<body>
</body>
</html>
