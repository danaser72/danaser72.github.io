<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      window.addEventListener('load', function() {
        document.getElementById("navigator").innerHTML = navigator.userAgent;
      });
      
      var appUtil = {};
      var IOS_DEVICE = "ios";
      var ANDROID_DEVICE = "android";

      appUtil.getDeviceType = function () {
          var uagent = navigator.userAgent.toLocaleLowerCase();
          if (uagent.search("android") > -1) {
              return ANDROID_DEVICE;
          } else if (uagent.search("iphone") > -1 || uagent.search("ipod") > -1 || uagent.search("ipad") > -1) {
              return IOS_DEVICE;
          }
      };

      const chkDevice = () => {
        var deviceType = appUtil.getDeviceType();
        const layer = document.getElementById("device");
        if (deviceType === IOS_DEVICE) {
          layer.innerHTML = "iOS";
        } else if (deviceType === ANDROID_DEVICE) {
          layer.innerHTML = "안드로이드";
        } else {
          layer.innerHTML = "알 수 없음";
        }
      }
      
      const moveAppStore = () => {
        chkDevice();
        var deviceType = appUtil.getDeviceType();
        if (deviceType === IOS_DEVICE) {
          location.href = "https://apps.apple.com/kr/app/%EC%8A%A4%EB%A7%88%ED%8A%B8%EB%B9%8C-%EC%A0%84%EC%9E%90%EC%84%B8%EA%B8%88%EA%B3%84%EC%82%B0%EC%84%9C/id6760402235?l=en-GB";
        } else {
          location.href = "https://play.google.com/store/apps/details?id=kr.co.businesson.smartbill2";
        }
      }

      const openApp = (type) => {
        try {
          switch (type) {
            case 1:
              location.href = 'smartbill2://';
              break;
            case 2:
              location.replace('smartbill2://');
              break;
            case 3:
              location.href = `intent://#Intent;scheme=smartbill2;package=kr.co.businesson.smartbill2`;
              break;
            case 4:
              const url = document.getElementById("txtUrl").value;
              location.href = url;
              break;
          }
        }
        catch(e) {
          alert(JSON.stringify(e));
        }
      }
    </script>
  </head>
<body>
  <div id="navigator"></div>
  <div id="device"></div>
  <button type="button" onclick="chkDevice()">디바이스 확인</button>
  <button type="button" onclick="moveAppStore()">이동</button>

  <div>
    <button type="button" onclick="openApp(1)">앱 열기 - location.href</button>
    <button type="button" onclick="openApp(2)">앱 열기 - location.replace</button>
    <button type="button" onclick="openApp(3)">앱 열기 - intent</button>
    <div>
      <input type="text" id="txtUrl" value="intent://#Intent;scheme=smartbill2;package=kr.co.businesson.smartbill2"> <button type="button" onclick="openApp(4)">앱 열기 - custom</button>
    </div>
  </div>
</body> 
</html>
